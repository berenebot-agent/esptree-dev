name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-dist:
    name: UI dist is current
    runs-on: ubuntu-latest

    steps:
      # Vite embeds HEAD's git hash/date in the bundle. For pull requests,
      # check out the actual PR head (including fork PRs), not GitHub's
      # synthetic merge commit, so a correctly committed dist stays clean.
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Rebuild committed UI
        working-directory: ui
        run: npm run build

      - name: Verify ui/dist was committed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- ui/dist)" ]]; then
            echo "::error::ui/dist is stale. Run 'cd ui && npm ci && npm run build' and commit the regenerated ui/dist files."
            echo
            echo "Changed/untracked dist files:"
            git status --short -- ui/dist
            echo
            echo "Tracked diff:"
            git diff -- ui/dist
            exit 1
          fi

          echo "ui/dist matches the current UI source."

  regression-tests:
    name: Fix regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # Debian Bookworm, used by the add-on image, ships Python 3.11.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r test/requirements-test.txt

      # Run the add-on and integration suites in separate pytest processes.
      # ha_integration/tests/conftest.py replaces `google.protobuf` in sys.modules
      # with a stub during collection; sharing a process breaks the add-on
      # protobuf import (esp_tree_runtime_pb2.py).
      #
      # Both suites run in full. This mirrors test/run-unit-tests.sh, which is the
      # command contributors use locally, so a local pass means a CI pass. It
      # previously ran 4 add-on tests and 1 integration test, so a change breaking
      # any of the other ~175 merged green.
      - name: Run add-on regression tests
        run: python -m pytest -p no:cacheprovider test/tests -v

      - name: Run integration regression tests
        working-directory: ha_integration
        run: python -m pytest -p no:cacheprovider tests -v

  required:
    name: CI Required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - ui-dist
      - regression-tests

    steps:
      - name: Verify required jobs passed
        env:
          UI_DIST_RESULT: ${{ needs.ui-dist.result }}
          REGRESSION_RESULT: ${{ needs.regression-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UI dist: $UI_DIST_RESULT"
          echo "Regression tests: $REGRESSION_RESULT"

          [[ "$UI_DIST_RESULT" == "success" ]]
          [[ "$REGRESSION_RESULT" == "success" ]]
