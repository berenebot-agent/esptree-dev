name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-dist:
    name: UI dist is current
    runs-on: ubuntu-latest

    steps:
      # Vite embeds HEAD's git hash/date in the bundle. For pull requests,
      # check out the actual PR head (including fork PRs), not GitHub's
      # synthetic merge commit, so a correctly committed dist stays clean.
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Rebuild committed UI
        working-directory: ui
        run: npm run build

      - name: Verify ui/dist was committed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- ui/dist)" ]]; then
            echo "::error::ui/dist is stale. Run 'cd ui && npm ci && npm run build' and commit the regenerated ui/dist files."
            echo
            echo "Changed/untracked dist files:"
            git status --short -- ui/dist
            echo
            echo "Tracked diff:"
            git diff -- ui/dist
            exit 1
          fi

          echo "ui/dist matches the current UI source."

  regression-tests:
    name: Fix regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # Debian Bookworm, used by the add-on image, ships Python 3.11.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio PyYAML

      - name: Run regression tests for reviewed fixes
        run: |
          python -m pytest -q \
            test/tests/test_v2_ota.py::test_ha_config_flow_rest_payloads_match_core_contract \
            test/tests/test_v2_ota.py::test_serial_auth_does_not_accept_snapshot_as_authentication \
            test/tests/test_v2_ota.py::test_serial_auth_buffers_snapshot_until_auth_ok \
            test/tests/test_flash_wizard_validation.py \
            ha_integration/tests/test_remote_forget.py

  required:
    name: CI Required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - ui-dist
      - regression-tests

    steps:
      - name: Verify required jobs passed
        env:
          UI_DIST_RESULT: ${{ needs.ui-dist.result }}
          REGRESSION_RESULT: ${{ needs.regression-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UI dist: $UI_DIST_RESULT"
          echo "Regression tests: $REGRESSION_RESULT"

          [[ "$UI_DIST_RESULT" == "success" ]]
          [[ "$REGRESSION_RESULT" == "success" ]]
