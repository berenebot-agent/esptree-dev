# ESP-NOW Bridge — Serial Mode (USB CDC)
# Uses serial_transport instead of WiFi/MQTT for upstream communication.
#
# Usage:
# 1. Copy demos/secrets.example.yaml to demos/secrets.yaml
# 2. Edit demos/secrets.yaml with your actual credentials
# 3. Compile: esphome compile demos/espnow-bridge-c5-serial.yml
# 4. Flash: esphome upload demos/espnow-bridge-c5-serial.yml
#
# Note: No wifi: block — serial mode (WiFi not required when serial_transport is present)

esphome:
  name: espnow-bridge-c5-serial
  friendly_name: ESP-NOW C5 Bridge Serial

esp32:
  board: esp32-c5-devkitc-1
  variant: esp32c5
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "12288"

logger:
  # Pin the console to UART0 explicitly. Without `hardware_uart:` ESPHome
  # defaults an ESP32-C5/C6/S3 to USB-Serial-JTAG and generates
  # CONFIG_ESP_CONSOLE_UART_NUM=-1, which routes the log stream AND any panic
  # backtrace to native USB — a port this board does not use. On a CH340/CP2102
  # wired to tx_pin/rx_pin below, that makes an early crash indistinguishable
  # from a silent hang. Keep this on the same UART (and baud) as bridge_uart.
  hardware_uart: UART0
  baud_rate: 460800
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_tree_bridge, esp_tree_common]

# web_server_base (and the OTA platform) require the `network` component, which
# is normally pulled in by wifi:. In serial mode there is no wifi: block, so it
# must be requested explicitly or config validation fails with
# "Component web_server_base requires component network".
network:

web_server:
  port: 80

# UART bus for serial transport — baud_rate and rx_buffer_size are configured here.
# For hardware UART adapters (CP2102, CH340) use tx_pin/rx_pin. The larger
# rx_buffer_size is required here: the ESP32 hardware FIFO is only 128 bytes and
# data arrives at ~46 KB/s at 460800 baud, so a small buffer overflows during
# ESP-NOW radio operations.
#
# NOTE: `hardware_uart:` is NOT a valid option under `uart:` in ESPHome — it only
# exists under `logger:`. A previous revision of this file used
# `hardware_uart: USB_CDC` here, which fails validation outright.
uart:
  - id: bridge_uart
    baud_rate: 460800
    rx_buffer_size: 16384
    tx_pin: GPIO1
    rx_pin: GPIO3

esp_tree_bridge:
  id: bridge_component
  network_id: !secret espnow_network_id
  psk: !secret espnow_psk
  espnow_mode: regular
  ota_over_espnow: true
  heartbeat_interval_seconds: 60
  api_key: !secret bridge_api_key
  serial_transport:
    uart_id: bridge_uart
    # `usb_cdc: {}` is only correct on boards wired via native USB (ESP32-C5/S3/S2
    # native CDC). This demo uses a hardware UART adapter (tx_pin/rx_pin above),
    # so USE_USB_CDC must NOT be set — omit usb_cdc entirely.

# No wifi: block — serial mode (WiFi not required when serial_transport is present)